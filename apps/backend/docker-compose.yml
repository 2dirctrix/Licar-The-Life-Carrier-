services:
  app:
    image: spring:latest
    container_name: spring
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - drug-network


  postgres:
    container_name: postgres
    build:
      context: ./db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drug-network


  redis:
    image: redis:6.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - redis-data:/data
    networks:
      - drug-network

  mosquitto:
    container_name: mosquitto
    build:
      context: ./mqtt
    ports:
      - "9001:9001"
    networks:
      - drug-network

networks:
  drug-network:
    external: true

volumes:
  postgres-data:
  redis-data: