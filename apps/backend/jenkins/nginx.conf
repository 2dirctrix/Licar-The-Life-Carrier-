server {
    listen 80;
    server_name j13c206.p.ssafy.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name j13c206.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/j13c206.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j13c206.p.ssafy.io/privkey.pem;

    resolver 127.0.0.11 valid=5s;

    set $spring_upstream spring:8080;
    set $mqtt_upstream mosquitto:9001;

    location /jenkins/ {
        proxy_pass http://jenkins:8080/jenkins/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/notifications/subscribe {
        proxy_pass http://$spring_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE를 위한 설정 추가
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://$spring_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mqtt/ {
        proxy_pass http://$mqtt_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
    }
}